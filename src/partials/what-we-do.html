<section class="what-we-do section-spacing" id="what-we-do" data-section="what-we-do">
  <div class="container-custom">
    <div class="grid-2">
      <!-- Left Column: Copy & Link -->
      <div class="what-we-do__text" data-anim="fade-up">
        <div class="pill-badge">
          <span class="pill-badge__dot"></span>
          What We Do
        </div>
        <h2 class="section-title">
          The quiet intelligence <i class="voice-word">behind your brand</i>
        </h2>
        <p
          style="
            color: var(--muted);
            font-size: 18px;
            max-width: 520px;
            line-height: 1.6;
            margin-top: 16px;
          "
        >
          We build custom AI ecosystems that eliminate manual friction, generate studio-grade
          commercial visuals, and run business operations around the clock.
        </p>
        <a href="#services" class="about-link">
          <span>About more</span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <use href="#icon-arrow-up-right"></use>
          </svg>
        </a>
      </div>

      <!-- Right Column: Photo + Staggered Stat Cards -->
      <div class="what-we-do__media-wrap">
        <div class="what-we-do__photo-box" data-anim="fade-up" data-delay="0.1">
          <img
            src="/assets/what-we-do.jpg"
            alt="anahum AI systems in operation"
            width="720"
            height="560"
            loading="lazy"
          />
        </div>

        <!-- Stat Card 01 (Accent) -->
        <div class="stat-card stat-card--accent" data-anim="fade-up" data-delay="0.25">
          <div class="stat-card__index">01</div>
          <div class="stat-card__number">98%</div>
          <div class="stat-card__label">Efficiency Gain</div>
        </div>

        <!-- Stat Card 02 (Surface) -->
        <div class="stat-card stat-card--surface" data-anim="fade-up" data-delay="0.4">
          <div class="stat-card__index">02</div>
          <div class="stat-card__bar"></div>
          <div style="font-weight: 700; font-size: 20px; color: var(--ink)">140+ Systems</div>
          <div style="font-size: 13px; color: var(--muted); margin-top: 4px">
            Deployed Worldwide
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
