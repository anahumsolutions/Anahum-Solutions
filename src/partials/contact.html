<section class="contact-section section-spacing" id="contact" data-section="contact">
  <div class="container-custom">
    <div class="section-heading" data-anim="fade-up">
      <div class="pill-badge">
        <span class="pill-badge__dot"></span>
        Contact
      </div>
      <h2>Tell us what you want to <i class="voice-word">create or automate.</i></h2>
      <p class="section-intro">Send a message and we will reply within 24 hours.</p>
    </div>

    <div class="contact-grid" data-anim="fade-up" data-delay="0.1">
      <!-- Left: Contact channel cards -->
      <div class="contact-channels">
        <a
          href="https://wa.me/923154755627"
          class="contact-channel-card"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="WhatsApp: +92 315 4755627"
        >
          <div class="icon-tile icon-tile--accent" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-chat"></use></svg>
          </div>
          <div class="contact-channel-text">
            <span class="contact-channel-label">WhatsApp</span>
            <span class="contact-channel-value">+92 315 4755627</span>
          </div>
          <svg class="contact-channel-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <use href="#icon-arrow-up-right"></use>
          </svg>
        </a>

        <a
          href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=anahumsolutions@gmail.com&amp;su=Project%20enquiry%20for%20anahum"
          class="contact-channel-card"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Email: anahumsolutions@gmail.com (opens Gmail in a new tab)"
        >
          <div class="icon-tile icon-tile--soft" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-bolt"></use></svg>
          </div>
          <div class="contact-channel-text">
            <span class="contact-channel-label">Email</span>
            <span class="contact-channel-value">anahumsolutions@gmail.com</span>
          </div>
          <svg class="contact-channel-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <use href="#icon-arrow-up-right"></use>
          </svg>
        </a>

        <a
          href="https://www.instagram.com/anahum.solutions"
          class="contact-channel-card"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram: @anahum.solutions"
        >
          <div class="icon-tile icon-tile--light" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-instagram"></use></svg>
          </div>
          <div class="contact-channel-text">
            <span class="contact-channel-label">Instagram</span>
            <span class="contact-channel-value">@anahum.solutions</span>
          </div>
          <svg class="contact-channel-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <use href="#icon-arrow-up-right"></use>
          </svg>
        </a>

        <a
          href="https://www.linkedin.com/company/anahum-solutions"
          class="contact-channel-card"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn: Anahum Solutions"
        >
          <div class="icon-tile icon-tile--light" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-linkedin"></use></svg>
          </div>
          <div class="contact-channel-text">
            <span class="contact-channel-label">LinkedIn</span>
            <span class="contact-channel-value">Anahum Solutions</span>
          </div>
          <svg class="contact-channel-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <use href="#icon-arrow-up-right"></use>
          </svg>
        </a>

        <a
          href="https://www.facebook.com/profile.php?id=61596873171203"
          class="contact-channel-card"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook: Anahum Solutions"
        >
          <div class="icon-tile icon-tile--light" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-facebook"></use></svg>
          </div>
          <div class="contact-channel-text">
            <span class="contact-channel-label">Facebook</span>
            <span class="contact-channel-value">Anahum Solutions</span>
          </div>
          <svg class="contact-channel-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <use href="#icon-arrow-up-right"></use>
          </svg>
        </a>
      </div>

      <!-- Right: Contact form -->
      <div class="contact-form-wrap">
        <form id="contactForm" method="POST" novalidate>
          <!-- Honeypot -->
          <div
            aria-hidden="true"
            style="
              position: absolute;
              left: -9999px;
              top: auto;
              width: 1px;
              height: 1px;
              overflow: hidden;
            "
          >
            <label for="_gotcha">Leave this empty</label>
            <input type="text" id="_gotcha" name="_gotcha" tabindex="-1" autocomplete="off" />
          </div>

          <div class="form-field">
            <label class="form-label" for="cf-name">Name <span aria-hidden="true">*</span></label>
            <input
              class="form-input"
              type="text"
              id="cf-name"
              name="name"
              required
              autocomplete="name"
              placeholder="Your name"
            />
          </div>

          <div class="form-field">
            <label class="form-label" for="cf-email">Email <span aria-hidden="true">*</span></label>
            <input
              class="form-input"
              type="email"
              id="cf-email"
              name="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
            />
          </div>

          <div class="form-field">
            <label class="form-label" for="cf-whatsapp"
              >WhatsApp number <span class="form-optional">(optional)</span></label
            >
            <input
              class="form-input"
              type="tel"
              id="cf-whatsapp"
              name="whatsapp"
              autocomplete="tel"
              placeholder="+1 234 567 8900"
            />
          </div>

          <div class="form-field">
            <label class="form-label" for="cf-service">What do you need?</label>
            <select class="form-input form-select" id="cf-service" name="service">
              <option value="AI fashion shoots">AI fashion shoots</option>
              <option value="AI product visuals">AI product visuals</option>
              <option value="Workflow automation">Workflow automation</option>
              <option value="AI agents &amp; chatbots">AI agents &amp; chatbots</option>
              <option value="Custom AI system">Custom AI system</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-field">
            <label class="form-label" for="cf-message"
              >Message <span aria-hidden="true">*</span></label
            >
            <textarea
              class="form-input form-textarea"
              id="cf-message"
              name="message"
              required
              rows="5"
              placeholder="Tell us about your project…"
            ></textarea>
          </div>

          <button type="submit" class="btn btn--primary" id="cfSubmit">Send message</button>

          <div class="form-status" id="cfStatus" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </div>
</section>
